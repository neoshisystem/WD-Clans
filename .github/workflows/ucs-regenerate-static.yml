name: UCS One-Time Static Regeneration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate static data from Canonical
        run: node scripts/generate-static-vertical-slice.js
      - name: Commit generated static artifacts when changed
        run: |
          if git diff --quiet -- site/data/ucs-vertical-slice.json site/data/ucs-vertical-slice.js; then
            echo "Static artifacts already match the generator."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/ucs-vertical-slice.json site/data/ucs-vertical-slice.js
          git commit -m "fix(UCS): regenerate static artifacts from Canonical"
          git push
