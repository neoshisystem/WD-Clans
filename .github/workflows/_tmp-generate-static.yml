name: UCS Temporary Static Generator

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/generate-static-vertical-slice.js
      - name: Commit generated static
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- site/data/ucs-vertical-slice.json site/data/ucs-vertical-slice.js; then
            echo "Static bundle already matches generator."
            exit 0
          fi
          git add site/data/ucs-vertical-slice.json site/data/ucs-vertical-slice.js
          git commit -m "build(UCS): regenerate static from canonical [skip ci]"
          git push origin HEAD:main
