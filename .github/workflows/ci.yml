name: UCS Foundation Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: node --check src/league.js
      - run: node --check src/identity.js
      - run: node --check src/membership.js
      - run: node --check src/metrics.js
      - run: node --check src/validate-snapshot.js
