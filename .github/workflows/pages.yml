name: Deploy UCS Static Site to GitHub Pages
# UCS: deployment trigger aligned to approved monotonic Snapshot contract.
# UCS: post-replay validation refresh 2026-10-01.
# UCS: SA01 identity-resolution verification trigger 2026-10-02.

on:
  push:
    branches:
      - main
    paths:
      - "data/**"
      - "site/**"
      - "scripts/generate-static-vertical-slice.js"
      - ".github/workflows/pages.yml"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate project
        run: npm test

      - name: Regenerate static data from Canonical
        run: node scripts/generate-static-vertical-slice.js

      - name: Verify generated static data is committed
        run: git diff --exit-code -- site/data/ucs-vertical-slice.json site/data/ucs-vertical-slice.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
